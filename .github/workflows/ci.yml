name: CI

# Se declenche a chaque push et pull request vers main -- pas besoin
# de lancer les tests manuellement, GitHub le fait pour toi et
# affiche un badge vert/rouge directement sur le repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Un vrai PostgreSQL est lance comme "service" a cote du job,
    # avec les memes identifiants que dans docker-compose.yml.
    # Pourquoi tester avec une vraie base plutot que de mocker :
    # ca aurait laisse passer silencieusement tous les bugs SQL
    # qu'on a rencontres pendant ce projet (contraintes, types,
    # jointures) -- un mock ne les aurait jamais detectes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: ecommerce_pass
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_user -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r backend/requirements.txt

      - name: Appliquer le schema (Phase 1 + Phase 3)
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=ecommerce_pass psql -h localhost -U ecommerce_user -d ecommerce -f sql/01_schema.sql
          PGPASSWORD=ecommerce_pass psql -h localhost -U ecommerce_user -d ecommerce -f sql/02_warehouse_schema.sql

      - name: Verifier que l'API demarre (smoke test)
        # On ne teste pas /ml/churn ici : ca demanderait le modele
        # entraine (fichier de plusieurs centaines de Ko), qu'on ne
        # versionne pas sur GitHub (voir .gitignore). Un smoke test
        # sur les endpoints de base suffit a attraper les erreurs
        # d'import ou de configuration les plus courantes.
        env:
          DATABASE_URL: postgresql+psycopg://ecommerce_user:ecommerce_pass@localhost:5432/ecommerce
        run: |
          cd backend/app
          python -c "
          from fastapi.testclient import TestClient
          from main import app
          client = TestClient(app)
          r = client.get('/')
          assert r.status_code == 200, f'root a echoue: {r.status_code}'
          r = client.get('/customers/?limit=5')
          assert r.status_code == 200, f'customers a echoue: {r.status_code}'
          print('Smoke test backend OK')
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        working-directory: frontend
        run: npm install

      - name: Build de production
        working-directory: frontend
        run: npm run build
